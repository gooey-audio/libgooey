<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1340" width="1040" height="1340" role="img" aria-labelledby="t d">
<title id="t">Twin Core percussion voice: signal flow</title>
<desc id="d">A trigger fires a delayed exciter pulse into two serial resonator cores. Core one can frequency-modulate core two, and core two can feed back into core one when chaos is above one half. The body passes through a mode tap, a wavefolder, a VCA and a vactrol low-pass gate, then sums with an independently enveloped noise path, which can instead excite the cores.</desc>
<defs>
<style>
text { font-family: Inter, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
.h1 { font-size: 26px; font-weight: 700; fill: #1d2330; }
.sub { font-size: 14px; fill: #5b6576; }
.title { font-size: 17px; font-weight: 650; }
.role { font-size: 13px; fill: #3d4656; }
.param { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
         font-size: 12px; fill: #4a5568; }
.badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
.new { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
.pill { font-size: 14px; font-weight: 600; fill: #ffffff; }
.sum { font-size: 22px; font-weight: 600; fill: #3d4656; }
.edge { font-size: 12.5px; font-weight: 600; }
.legend { font-size: 13px; fill: #3d4656; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4656"/></marker>
<marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9488"/></marker>
<marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6365a"/></marker>
</defs>
<rect width="1040" height="1340" rx="24" fill="#fbfaf7"/>
<text x="40" y="52" class="h1" text-anchor="start">Twin Core percussion voice</text>
<text x="40" y="78" class="sub" text-anchor="start">Signal flow from trigger to output. Numbers match the node notes.</text>
<path d="M380,134 V174" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M435,116 H815 V174" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="108" class="edge" fill="#3d4656" text-anchor="start">same trigger fires the noise</text>
<path d="M950,134 V174" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,270 V296" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,392 V407" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,445 V466" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="462" class="edge" fill="#3d4656" text-anchor="start">strike + body noise + chaos</text>
<path d="M380,562 V608" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="592" class="edge" fill="#3d4656" text-anchor="start">low-pass (cores in series)</text>
<path d="M380,704 V756" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="736" class="edge" fill="#3d4656" text-anchor="start">low-pass and band-pass taps</text>
<path d="M380,852 V878" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,974 V1000" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,1096 V1122" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,1218 V1241" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,1279 V1292 H530" fill="none" stroke="#3d4656" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="540.0" y="1274" width="250" height="36" rx="18" fill="#1d2330"/>
<text x="665" y="1297" class="pill" text-anchor="middle">× volume × √velocity → out</text>
<path d="M785,288 V428 H401" fill="none" stroke="#6b7a90" stroke-width="2" marker-end="url(#arrow)"/>
<text x="777" y="314" class="edge" fill="#6b7a90" text-anchor="end">BODY mode:</text>
<text x="777" y="330" class="edge" fill="#6b7a90" text-anchor="end">low-passed noise</text>
<text x="777" y="346" class="edge" fill="#6b7a90" text-anchor="end">excites the cores</text>
<path d="M945,288 V1262 H401" fill="none" stroke="#6b7a90" stroke-width="2" marker-end="url(#arrow)"/>
<text x="937" y="314" class="edge" fill="#6b7a90" text-anchor="end">LP / HP mode:</text>
<text x="937" y="330" class="edge" fill="#6b7a90" text-anchor="end">mixed straight</text>
<text x="937" y="346" class="edge" fill="#6b7a90" text-anchor="end">to the output</text>
<path d="M545.0,516 H615.0 V658 H549.0" fill="none" stroke="#0f9488" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#arrow-x)"/>
<text x="625.0" y="582" class="edge" fill="#0f9488" text-anchor="start">cross mod</text>
<text x="625.0" y="598" class="edge" fill="#0f9488" text-anchor="start">core 1 bends</text>
<text x="625.0" y="614" class="edge" fill="#0f9488" text-anchor="start">core 2 pitch</text>
<path d="M215.0,658 H145.0 V428 H359" fill="none" stroke="#d6365a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-c)"/>
<text x="135.0" y="500" class="edge" fill="#d6365a" text-anchor="end">chaos &gt; 0.5</text>
<text x="135.0" y="516" class="edge" fill="#d6365a" text-anchor="end">core 2 band-pass</text>
<text x="135.0" y="532" class="edge" fill="#d6365a" text-anchor="end">fed back through</text>
<text x="135.0" y="548" class="edge" fill="#d6365a" text-anchor="end">a saturator,</text>
<text x="135.0" y="564" class="edge" fill="#d6365a" text-anchor="end">gated by the</text>
<text x="135.0" y="580" class="edge" fill="#d6365a" text-anchor="end">body envelope</text>
<rect x="325.0" y="98" width="110" height="36" rx="18" fill="#3d4656"/>
<text x="380" y="121" class="pill" text-anchor="middle">TRIG</text>
<rect x="895.0" y="98" width="110" height="36" rx="18" fill="#6b7a90"/>
<text x="950" y="121" class="pill" text-anchor="middle">N-TRIG</text>
<g class="node" id="node-1">
<rect x="215.0" y="178" width="330" height="92" rx="14" fill="#fff4d6" stroke="#d08a00" stroke-width="2"/>
<circle cx="239.0" cy="202" r="13" fill="#d08a00"/>
<text x="239.0" y="207" class="badge" text-anchor="middle">1</text>
<text x="261.0" y="208" class="title" fill="#7a5000">Trigger delay</text>
<text x="233.0" y="232" class="role" text-anchor="start">Holds back the body; the noise fires on time</text>
<text x="233.0" y="254" class="param" text-anchor="start">trigger_delay</text>
</g>
<g class="node" id="node-2">
<rect x="215.0" y="300" width="330" height="92" rx="14" fill="#fff4d6" stroke="#d08a00" stroke-width="2"/>
<circle cx="239.0" cy="324" r="13" fill="#d08a00"/>
<text x="239.0" y="329" class="badge" text-anchor="middle">2</text>
<text x="261.0" y="330" class="title" fill="#7a5000">Exciter</text>
<text x="233.0" y="354" class="role" text-anchor="start">A 0.75 ms pulse, scaled by velocity</text>
<text x="233.0" y="376" class="param" text-anchor="start">velocity</text>
</g>
<circle cx="380" cy="428" r="17" fill="#ffffff" stroke="#3d4656" stroke-width="2"/>
<text x="380" y="434" class="sum" text-anchor="middle">+</text>
<g class="node" id="node-3">
<rect x="215.0" y="470" width="330" height="92" rx="14" fill="#e0ecff" stroke="#2f6fdb" stroke-width="2"/>
<circle cx="239.0" cy="494" r="13" fill="#2f6fdb"/>
<text x="239.0" y="499" class="badge" text-anchor="middle">3</text>
<text x="261.0" y="500" class="title" fill="#163d82">Core 1</text>
<rect x="493.0" y="482" width="40" height="20" rx="10" fill="#d6365a"/>
<text x="513.0" y="496" class="new" text-anchor="middle">NEW</text>
<text x="233.0" y="524" class="role" text-anchor="start">Struck resonator; pitch sweep gives the punch</text>
<text x="233.0" y="546" class="param" text-anchor="start">tune · fm_depth · fm_decay · chaos</text>
</g>
<g class="node" id="node-4">
<rect x="215.0" y="612" width="330" height="92" rx="14" fill="#e0ecff" stroke="#2f6fdb" stroke-width="2"/>
<circle cx="239.0" cy="636" r="13" fill="#2f6fdb"/>
<text x="239.0" y="641" class="badge" text-anchor="middle">4</text>
<text x="261.0" y="642" class="title" fill="#163d82">Core 2</text>
<rect x="493.0" y="624" width="40" height="20" rx="10" fill="#d6365a"/>
<text x="513.0" y="638" class="new" text-anchor="middle">NEW</text>
<text x="233.0" y="666" class="role" text-anchor="start">Second resonator, tuned below core 1</text>
<text x="233.0" y="688" class="param" text-anchor="start">detune · cross_mod · chaos</text>
</g>
<g class="node" id="node-5">
<rect x="215.0" y="760" width="330" height="92" rx="14" fill="#efe7ff" stroke="#7a4fd6" stroke-width="2"/>
<circle cx="239.0" cy="784" r="13" fill="#7a4fd6"/>
<text x="239.0" y="789" class="badge" text-anchor="middle">5</text>
<text x="261.0" y="790" class="title" fill="#43278a">Body mode tap</text>
<text x="233.0" y="814" class="role" text-anchor="start">Picks which filter outputs make the body</text>
<text x="233.0" y="836" class="param" text-anchor="start">body_mode: LOW · MID · HIGH</text>
</g>
<g class="node" id="node-6">
<rect x="215.0" y="882" width="330" height="92" rx="14" fill="#efe7ff" stroke="#7a4fd6" stroke-width="2"/>
<circle cx="239.0" cy="906" r="13" fill="#7a4fd6"/>
<text x="239.0" y="911" class="badge" text-anchor="middle">6</text>
<text x="261.0" y="912" class="title" fill="#43278a">Wavefolder</text>
<rect x="493.0" y="894" width="40" height="20" rx="10" fill="#d6365a"/>
<text x="513.0" y="908" class="new" text-anchor="middle">NEW</text>
<text x="233.0" y="936" class="role" text-anchor="start">Folds the body for extra harmonics (2×)</text>
<text x="233.0" y="958" class="param" text-anchor="start">harmonics · symmetry</text>
</g>
<g class="node" id="node-7">
<rect x="215.0" y="1004" width="330" height="92" rx="14" fill="#ddf5e5" stroke="#1f9d55" stroke-width="2"/>
<circle cx="239.0" cy="1028" r="13" fill="#1f9d55"/>
<text x="239.0" y="1033" class="badge" text-anchor="middle">7</text>
<text x="261.0" y="1034" class="title" fill="#0f5c31">Body VCA</text>
<text x="233.0" y="1058" class="role" text-anchor="start">Decay envelope for the whole body</text>
<text x="233.0" y="1080" class="param" text-anchor="start">length · body_bias</text>
</g>
<g class="node" id="node-8">
<rect x="215.0" y="1126" width="330" height="92" rx="14" fill="#ddf5e5" stroke="#1f9d55" stroke-width="2"/>
<circle cx="239.0" cy="1150" r="13" fill="#1f9d55"/>
<text x="239.0" y="1155" class="badge" text-anchor="middle">8</text>
<text x="261.0" y="1156" class="title" fill="#0f5c31">Vactrol LPG</text>
<rect x="493.0" y="1138" width="40" height="20" rx="10" fill="#d6365a"/>
<text x="513.0" y="1152" class="new" text-anchor="middle">NEW</text>
<text x="233.0" y="1180" class="role" text-anchor="start">Low-pass gate: darkens as it fades</text>
<text x="233.0" y="1202" class="param" text-anchor="start">lpg</text>
</g>
<circle cx="380" cy="1262" r="17" fill="#ffffff" stroke="#3d4656" stroke-width="2"/>
<text x="380" y="1268" class="sum" text-anchor="middle">+</text>
<g class="node" id="node-9">
<rect x="730.0" y="178" width="270" height="110" rx="14" fill="#eef1f5" stroke="#6b7a90" stroke-width="2"/>
<circle cx="754.0" cy="202" r="13" fill="#6b7a90"/>
<text x="754.0" y="207" class="badge" text-anchor="middle">9</text>
<text x="776.0" y="208" class="title" fill="#323c4c">Noise</text>
<text x="748.0" y="232" class="role" text-anchor="start">Filtered noise with its own envelope</text>
<text x="748.0" y="254" class="param" text-anchor="start">noise_filter · noise_decay</text>
<text x="748.0" y="272" class="param" text-anchor="start">noise_bias · noise_mode</text>
</g>
<rect x="618" y="766" width="290" height="250" rx="14" fill="#ffffff" stroke="#d9dde4"/>
<text x="640" y="792" class="title" text-anchor="start">Key</text>
