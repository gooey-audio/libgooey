<text x="676" y="819" class="legend" text-anchor="start">Trigger and excitation</text>
<rect x="640" y="831" width="24" height="16" rx="4" fill="#e0ecff" stroke="#2f6fdb" stroke-width="2"/>
<text x="676" y="844" class="legend" text-anchor="start">Resonant cores</text>
<rect x="640" y="856" width="24" height="16" rx="4" fill="#efe7ff" stroke="#7a4fd6" stroke-width="2"/>
<text x="676" y="869" class="legend" text-anchor="start">Tone shaping</text>
<rect x="640" y="881" width="24" height="16" rx="4" fill="#ddf5e5" stroke="#1f9d55" stroke-width="2"/>
<text x="676" y="894" class="legend" text-anchor="start">Dynamics</text>
<rect x="640" y="906" width="24" height="16" rx="4" fill="#eef1f5" stroke="#6b7a90" stroke-width="2"/>
<text x="676" y="919" class="legend" text-anchor="start">Noise path</text>
<path d="M640,939 h26" stroke="#0f9488" stroke-width="2.5" stroke-dasharray="2 5"/>
<text x="676" y="944" class="legend" text-anchor="start">Audio-rate pitch modulation</text>
<path d="M640,964 h26" stroke="#d6365a" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="676" y="969" class="legend" text-anchor="start">Chaos feedback</text>
<rect x="636" y="979" width="34" height="18" rx="9" fill="#d6365a"/>
<text x="653" y="992" class="new" text-anchor="middle">NEW</text>
<text x="676" y="994" class="legend" text-anchor="start">Beyond the hardware design</text>
</svg>
